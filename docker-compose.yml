services:
  postgres:
    image: postgres:17
    container_name: harbor-postgres-container

    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: harbor-redis-container
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres_data: